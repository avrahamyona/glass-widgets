name: Build Windows
on: { workflow_dispatch: {}, push: { branches: [main], paths-ignore: ['README.md'] } }
permissions: { contents: write }
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject chat key
        shell: pwsh
        env: { GW_CHAT_KEY: '${{ secrets.GW_CHAT_KEY }}' }
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GW_CHAT_KEY)) { throw 'GW_CHAT_KEY secret is missing - create it in repo Settings > Secrets and variables > Actions' }
          $p = 'src/main.js'
          $s = [System.IO.File]::ReadAllText($p)
          if (-not $s.Contains('__GW_CHAT_KEY__')) { throw 'chat key placeholder not found in src/main.js' }
          [System.IO.File]::WriteAllText($p, $s.Replace('__GW_CHAT_KEY__', $env:GW_CHAT_KEY))
          if ([System.IO.File]::ReadAllText($p).Contains('__GW_CHAT_KEY__')) { throw 'chat key placeholder still present after injection' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet publish native/MediaBridge/MediaBridge.csproj -c Release -r win-x64 -o native/MediaBridge/publish
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r native/CloudBridge/requirements.txt
      - run: python -m PyInstaller --noconfirm --clean --onedir --name CloudBridge --collect-all pyicloud --collect-all keyrings --collect-all fido2 --collect-all tzdata --workpath native/CloudBridge/build --specpath native/CloudBridge --distpath native/CloudBridge/publish native/CloudBridge/bridge.py
      - name: Cloud helper smoke test
        shell: pwsh
        run: |
          '{"id":1,"action":"status"}' | & native/CloudBridge/publish/CloudBridge/CloudBridge.exe
          if ($LASTEXITCODE -ne 0) { throw 'Cloud helper failed' }
          $env:PYTHONIOENCODING = 'cp1252'
          $output = '{"id":2,"action":"code"}' | & native/CloudBridge/publish/CloudBridge/CloudBridge.exe
          $parsed = $output | ConvertFrom-Json
          if ($parsed.error -notmatch '[\u0590-\u05FF]' -or $output -match '[^\x00-\x7F]') { throw 'Unicode transport failed' }
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: GlassWidgets-win, path: dist/*.exe }
      - name: Release
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V-build.${{ github.run_number }}"
          gh release create "$TAG" dist/*.exe dist/latest.yml --title "GlassWidgets $TAG" --notes "## What's New in 0.4.19

          **GlassWidgets 0.4.19**
          - Fixed the island chat: replies are now fetched reliably and no longer get stuck after a long backlog (one-time catch-up of missed replies after updating)
          - Includes everything from 0.4.18"
