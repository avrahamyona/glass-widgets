name: Source holding and inheritance fixture validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed source fixture commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: source-inheritance-fixture-20261122
  cancel-in-progress: false
jobs:
  source-fixture:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/source-inheritance-20261122' && github.event.repository.private == false && github.sha == inputs.expected_sha
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MSBUILDDISABLENODEREUSE: '1'
      NODE_OPTIONS: ''
      NODE_PATH: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact approved source archive and expand own fixture source
        shell: pwsh
        run: |
          $archive = 'validation/source-holding-inheritance-tests.zip'
          $expected = '0237bdded66bbd039d29c78e49ca8b4b9411aaba2149825eb39199bbf49b6124'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'source_archive_hash_mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath '.ci/source-fixture' -Force
      - name: Verify portable argument and startup-layout checks
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet run --project .ci/source-fixture/tests/native-source-inheritance-portable/NativeSourceInheritancePortable.csproj --disable-build-servers -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build source-file acceptance using the unchanged runtime
        shell: pwsh
        run: |
          dotnet publish .ci/source-fixture/tests/native-source-files-windows/NativeSourceFilesWindows.csproj -c Release -r win-x64 --self-contained true -o .ci/source-files --disable-build-servers -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify own temporary source-file leases on Windows
        shell: pwsh
        run: |
          & '.ci/source-files/NativeSourceFilesWindows.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build inherited-source acceptance using the unchanged runtime
        shell: pwsh
        run: |
          dotnet publish .ci/source-fixture/tests/native-source-inheritance-windows/NativeSourceInheritanceWindows.csproj -c Release -r win-x64 --self-contained true -o .ci/source-inheritance --disable-build-servers -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify explicit source inheritance using only own child and temporary files
        shell: pwsh
        run: |
          & '.ci/source-inheritance/NativeSourceInheritanceWindows.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build abrupt original holder failure acceptance
        shell: pwsh
        run: |
          dotnet publish .ci/source-fixture/tests/native-source-holder-failure-windows/NativeSourceHolderFailureWindows.csproj -c Release -r win-x64 --self-contained true -o .ci/source-holder-failure --disable-build-servers -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify portable holder-plan serialization
        shell: pwsh
        run: |
          & '.ci/source-holder-failure/NativeSourceHolderFailureWindows.exe' '--portable-plan-check'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source protection through abrupt original helper death
        shell: pwsh
        run: |
          & '.ci/source-holder-failure/NativeSourceHolderFailureWindows.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download only the pinned official standalone Node dummy runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.ci/node-runtime'
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v20.18.3/win-x64/node.exe' -OutFile '.ci/node-runtime/node.exe'
          $actual = (Get-FileHash -LiteralPath '.ci/node-runtime/node.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '528a9aa64888a2a3ba71c6aea89434dd5ab5cb3caa9f0f31345cf5facf685ab0') { throw 'node_fixture_binary_hash_mismatch' }
      - name: Build Node source inheritance acceptance with the unchanged native runtime
        shell: pwsh
        run: |
          dotnet publish .ci/source-fixture/tests/native-source-node-windows/NativeSourceNodeWindows.csproj -c Release -r win-x64 --self-contained true -o .ci/source-node --disable-build-servers -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify portable Node fixture plan serialization
        shell: pwsh
        run: |
          & '.ci/source-node/NativeSourceNodeWindows.exe' '--portable-plan-check'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify delayed Node require after abrupt original holder death
        shell: pwsh
        run: |
          $env:GW_NODE_SOURCE_FIXTURE_PATH = (Resolve-Path '.ci/node-runtime/node.exe').Path
          & '.ci/source-node/NativeSourceNodeWindows.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
