name: Server control integration validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed validation commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: server-control-integration-20261122
  cancel-in-progress: false
jobs:
  owned-native-integration:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/receive-native-20261122' && github.event.repository.private == false && github.sha == inputs.expected_sha
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify all reviewed integration bytes
        run: node validation/check-integration-hashes.cjs
      - name: Preserve original receive-candidate checks
        run: node validation/test-candidate.cjs
      - name: Run private transport fixture checks
        run: node tests/native-handle-client-unit.js
      - name: Run native precision checks
        run: node tests/native-plan-precision-unit.js
      - name: Run integrated policy and persistence fixture checks
        run: node tests/integrated-server-control-unit.js
      - name: Run IPC origin and response-boundary checks
        run: node tests/server-control-ipc-unit.js
      - name: Build test-owned native host using the existing runner SDK
        run: |
          dotnet --list-sdks
          dotnet publish native/ServerControlHost/ServerControlHost.csproj -c Release -r win-x64 --self-contained true -o native/ServerControlHost/ci-publish --disable-build-servers -p:UseSharedCompilation=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Verify the native bridge against only our own dummy graph
        run: node tests/ci-native-server-control-integration.cjs
