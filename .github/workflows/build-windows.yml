name: Build Windows
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: receive-native-validation-20261122
  cancel-in-progress: false
jobs:
  compile-and-open-runtime-gate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/receive-native-20261122' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reviewed source hashes and candidate behavior
        run: node validation/test-candidate.cjs
      - name: Transport loopback test
        run: node tests/chat-transport-unit.js
      - name: Transport recovery tests
        run: node tests/chat-transport-recovery-unit.js
      - name: Compile native source only in Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='native/ServerControlPrep/VerifiedProcessHandle.cs'
          if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'acc1783f6d54cdb4385918fdb9faa93252e6298460525b925a12bcd33e0588f0'){throw 'reviewed_source_hash_required'}
          Add-Type -Path $p -ErrorAction Stop
          Write-Output 'PASS compilation only; native runtime behavior remains unverified.'
      - name: Compile native source only in PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='native/ServerControlPrep/VerifiedProcessHandle.cs'
          if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'acc1783f6d54cdb4385918fdb9faa93252e6298460525b925a12bcd33e0588f0'){throw 'reviewed_source_hash_required'}
          Add-Type -Path $p -ErrorAction Stop
          Write-Output 'PASS compilation only; native runtime behavior remains unverified.'
      - name: Keep native behavioral verification gate open
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          throw 'Native behavior is NOT validated. Run 44999012756 stopped before dummy creation because the current-session logon SID prerequisite was not satisfied. That safety check is unchanged and the runtime attempt is not retried here. This explicit open gate keeps the workflow red, even if independent package checks pass.'
  receive-package-only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/receive-native-20261122' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reviewed source hashes before independent packaging
        run: node validation/test-candidate.cjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build existing media helper for package
        run: dotnet publish native/MediaBridge/MediaBridge.csproj -c Release -r win-x64 -o native/MediaBridge/publish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build existing cloud helper for package
        run: |
          pip install -r native/CloudBridge/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onedir --name CloudBridge --collect-all pyicloud --collect-all keyrings --collect-all fido2 --collect-all tzdata --workpath native/CloudBridge/build --specpath native/CloudBridge --distpath native/CloudBridge/publish native/CloudBridge/bridge.py
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Build test-only installer without publishing
        run: npm run dist
      - name: Inspect transient installer and packaged candidate
        run: node validation/check-package.cjs
