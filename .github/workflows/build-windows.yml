name: Fixed boot query phase diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed fixture commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-owner-cas-fixture-20261122
  cancel-in-progress: false
jobs:
  native-cas-fixture:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/native-owner-cas-20261122' && github.event.repository.private == false && github.sha == inputs.expected_sha
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MSBUILDDISABLENODEREUSE: '1'
      NODE_OPTIONS: ''
      NODE_PATH: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Verify reviewed fixture bytes and expand only test source
        shell: pwsh
        run: |
          $archive='validation/native-launch-policy-fixture.zip'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e27f321c735df0a5b26311e95abbbd82ba15ae0df4da100164dfca3110dc9971') { throw 'fixture_archive_hash_mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath '.ci/native-cas-source'
      - name: Build exact native test candidate, framework-dependent
        shell: pwsh
        run: |
          dotnet publish .ci/native-cas-source/tests/native-owned-cas-windows/NativeOwnedCasWindows.csproj -c Release -r win-x64 --self-contained false -o .ci/native-cas/bin --disable-build-servers -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath '.ci/native-cas-source/tests/native-owned-cas-windows/Run-DisposableNormalUser.ps1' -Destination '.ci/native-cas/Run-DisposableNormalUser.ps1'
      - name: Fetch and verify official pinned standalone dummy Node runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v20.18.3/win-x64/node.exe' -OutFile '.ci/native-cas/node.exe'
          if ((Get-FileHash -LiteralPath '.ci/native-cas/node.exe' -Algorithm SHA256).Hash.ToLowerInvariant() -ne '528a9aa64888a2a3ba71c6aea89434dd5ab5cb3caa9f0f31345cf5facf685ab0') { throw 'node_fixture_binary_hash_mismatch' }
      - name: Execute one cold five-second phase probe as disposable non-administrator
        shell: pwsh
        run: |
          & '.ci/native-cas/Run-DisposableNormalUser.ps1'
          if (!$?) { throw 'normal_user_fixture_failed' }
