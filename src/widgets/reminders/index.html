<!doctype html><html lang=he dir=rtl><meta charset=utf-8><link rel=stylesheet href="../../shared/theme.css"><style>.widget{padding:14px;display:flex;flex-direction:column}.heading{font-size:12px;font-weight:700;color:#ff9500}.items{flex:1;min-height:0;overflow:auto;margin-top:7px}.item{display:flex;align-items:flex-start;gap:6px;border-bottom:.5px solid #8883;padding:6px 0}.circle{width:13px;height:13px;border:1.5px solid #ff9500;border-radius:50%;flex:none;margin-top:2px}.title{font-size:12px;line-height:1.3}.due{font-size:9px;color:var(--text2)}.meta{font-size:8px;color:var(--text2);margin:4px 0}button{border:0;background:#ff9500;color:white;border-radius:6px;font:600 10px var(--font);padding:6px;cursor:pointer}.empty{font-size:11px;color:var(--text2);line-height:1.4}</style><body><div class=widget><div class=heading>תזכורות · iCloud</div><div class="items nd" id=items></div><div class=meta id=meta>קריאה בלבד · ניסיוני</div><div class=nd><button id=refresh>עדכן</button> <button onclick="api.settingsOpen()">חיבור</button> <button onclick="api.cloudOpen('reminders')">ערוך באתר</button></div></div><script>
const q=new URLSearchParams(location.search);document.documentElement.dataset.theme=q.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');function draw(r){items.replaceChildren();for(const rem of r.reminders||[]){const row=document.createElement('div');row.className='item';const circle=document.createElement('i');circle.className='circle';const content=document.createElement('div');const title=document.createElement('div');title.className='title';title.textContent=rem.title;content.append(title);if(rem.due){const due=document.createElement('div');due.className='due';const date=new Date(rem.due);due.textContent=isNaN(date)?rem.due:date.toLocaleDateString('he-IL',{timeZone:'Asia/Jerusalem'});content.append(due)}row.append(circle,content);items.append(row)}if(!items.children.length){const e=document.createElement('div');e.className='empty';e.textContent=r.errors?.reminders||r.error||(r.at?'אין תזכורות פתוחות':'חבר את החשבון בהגדרות ולחץ עדכן');items.append(e)}meta.textContent='קריאה בלבד · '+(r.at?new Date(r.at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jerusalem'}):'לא עודכן')+(r.stale?' · מידע שמור':'');if(r.errors?.reminders)meta.textContent+=' · שגיאה'}refresh.onclick=async()=>{refresh.disabled=true;try{draw(await api.icloudRefresh())}finally{refresh.disabled=false}};if(q.get('demo'))draw({reminders:[{title:'לעבור על המשימות'},{title:'להכין רשימת קניות'},{title:'להוסיף רעיונות לפרויקט'}],at:Date.now()});else{const load=()=>api.icloudData().then(draw);load();setInterval(load,5000)}
</script><script src="../../shared/widget.js"></script>
