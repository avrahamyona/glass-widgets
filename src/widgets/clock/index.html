<!doctype html><meta charset=utf-8><html lang=he dir=rtl><link rel=stylesheet href="../../shared/theme.css">
<style>
.widget{display:grid;place-items:center;padding:14px;transition:transform .38s cubic-bezier(.3,1.4,.45,1)}
.tmr-on .widget{transform:scale(1.05)}
svg#c{width:100%;height:100%;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.18))}
.dg-on #c{display:none}
.dg-on #dg{position:absolute;inset:0;display:flex!important;flex-direction:column;align-items:center;justify-content:center;direction:ltr;text-align:center}
#c,#dg,.tlink{transition:opacity .18s ease,transform .36s cubic-bezier(.3,1.4,.45,1)}
.tmr-on #c,.tmr-on #dg,.tmr-on .tlink{opacity:0;transform:scale(.8);pointer-events:none}
.tmr-on.dg-on #dg{transform:scale(.8)}
.tlink{position:absolute;left:8px;bottom:7px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(128,128,128,.12);font:400 13px var(--font);color:var(--text2);cursor:pointer;z-index:5;-webkit-app-region:no-drag}
.dd{font-size:12px;font-weight:600;color:#ff3b30;direction:rtl}.tt{font-size:50px;font-weight:300;letter-spacing:-2px;line-height:1.05;font-variant-numeric:tabular-nums}.ds{font-size:11px;color:var(--text2);font-weight:500;margin-top:3px;direction:rtl}
#tmr{position:absolute;inset:0;-webkit-app-region:no-drag;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;opacity:0;visibility:hidden;transform:scale(.8);transition:opacity .18s ease,transform .36s cubic-bezier(.3,1.4,.45,1),visibility 0s linear .36s;z-index:6}
.tmr-on #tmr{opacity:1;visibility:visible;transform:scale(1);transition:opacity .22s ease .05s,transform .4s cubic-bezier(.3,1.4,.45,1),visibility 0s}
.xbtn{position:absolute;left:8px;top:7px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(128,128,128,.12);font:600 13px var(--font);color:var(--text2);cursor:pointer;z-index:5}
.tbtn{position:absolute;right:8px;top:7px;border:0;border-radius:7px;width:24px;height:24px;background:rgba(128,128,128,.12);font:600 14px var(--font);color:var(--text2);cursor:pointer;z-index:5}
.tbtn.on{background:var(--accent);color:#fff}
.ttl{font-size:13px;font-weight:600;color:var(--text2);margin:8px 0}
.times{display:flex;gap:6px;direction:ltr;margin-bottom:12px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:3px}
.tcol input{width:44px;height:38px;border:0;border-radius:10px;background:rgba(128,128,128,.12);color:var(--text);font:300 22px var(--font);text-align:center;outline:none;font-variant-numeric:tabular-nums}
.tcol label{font-size:10px;color:var(--text2)}
.go{border:0;border-radius:12px;padding:8px 26px;background:var(--accent);color:#fff;font:600 14px var(--font);cursor:pointer}
</style>
<body><div class=widget><button class="tlink nd" id=timerBtn title="פתח טיימר">⏱</button><svg id=c></svg><div id=dg style="display:none"><div class=dd id=dd></div><div class=tt id=tt></div><div class=ds id=ds></div></div>
<div id=tmr>
<button class="xbtn nd" id=xbtn title="סגור">✕</button>
<div id=setup>
 <div class=ttl>טיימר</div>
 <div class="times nd">
  <div class=tcol><input id=h inputmode=numeric maxlength=2 value=0><label>שעות</label></div>
  <div class=tcol><input id=m inputmode=numeric maxlength=2 value=5><label>דקות</label></div>
  <div class=tcol><input id=s inputmode=numeric maxlength=2 value=0><label>שניות</label></div>
 </div>
 <button class="go nd" id=start>הפעל</button>
</div>
</div>
</div>
<script src="clock.js"></script>
<script>
const q=new URLSearchParams(location.search);
const theme=q.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
document.documentElement.dataset.theme=theme;if(q.get('bg'))document.body.style.background='radial-gradient(300px 200px at 20% 10%,#f5a3c7,transparent 60%),linear-gradient(135deg,#7b5cff,#ff7eb3)';
function inTZ(tz){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));const n=new Date();n.setHours(+p.hour%24,+p.minute,+p.second,n.getMilliseconds());return n}
const style=q.get('style')||'analog';const set0=buildClock(document.getElementById('c'));
const HE=new Intl.DateTimeFormat('he-IL',{timeZone:q.get('tz')||'Asia/Jerusalem',weekday:'long',day:'numeric',month:'long'});
const set=d=>{if(style==='digital'){document.body.classList.add('dg-on');dg.style.display='';tt.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const dt=new Date();const p=HE.formatToParts(dt);dd.textContent=p.find(x=>x.type==='weekday').value;ds.textContent=p.filter(x=>x.type==='day'||x.type==='month').map(x=>x.value).join(' ')}else set0(d)};
const t=q.get('time');
let lastRender=0;
(function f(){try{const d=t?new Date('2026-10-06T'+t):inTZ(q.get('tz')||'Asia/Jerusalem');set(d);lastRender=Date.now()}catch(e){}if(!t)(style==='digital'?setTimeout(f,1000):requestAnimationFrame(f))})();
if(!t)setInterval(()=>{if(Date.now()-lastRender>3000){try{set(inTZ(q.get('tz')||'Asia/Jerusalem'));lastRender=Date.now()}catch(e){}}},3000);
</script>
<script>
function openTmr(){document.body.classList.add('tmr-on')}
function closeTmr(){document.body.classList.remove('tmr-on')}
if(window.api)timerBtn.onclick=openTmr;else timerBtn.style.display='none';
xbtn.onclick=closeTmr;
for(const el of [h,m,s])el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(0,2)});
start.onclick=()=>{const secs=(+h.value||0)*3600+(+m.value||0)*60+(+s.value||0);if(secs<1){m.focus();return}
 closeTmr();api.timerStart(secs)};
</script>

<script src="../../shared/widget.js"></script>
