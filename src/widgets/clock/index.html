<!doctype html><meta charset=utf-8><link rel=stylesheet href="../../shared/theme.css">
<style>.widget{display:grid;place-items:center;padding:14px}svg{width:100%;height:100%;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.18))}</style>
<body><div class=widget><svg id=c></svg></div>
<script src="clock.js"></script>
<script>
const q=new URLSearchParams(location.search);
const theme=q.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
document.documentElement.dataset.theme=theme;if(q.get('bg'))document.body.style.background='radial-gradient(300px 200px at 20% 10%,#f5a3c7,transparent 60%),linear-gradient(135deg,#7b5cff,#ff7eb3)';
function inTZ(tz){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));const n=new Date();n.setHours(+p.hour%24,+p.minute,+p.second,n.getMilliseconds());return n}
const set=buildClock(document.getElementById('c'));
const t=q.get('time');
(function f(){const d=t?new Date('2026-10-06T'+t):inTZ('Asia/Jerusalem');set(d);if(!t)requestAnimationFrame(f)})();
</script>
