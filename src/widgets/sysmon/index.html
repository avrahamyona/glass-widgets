<!doctype html><meta charset=utf-8><html lang=he dir=rtl><link rel=stylesheet href="../../shared/theme.css">
<style>
.widget{display:flex;justify-content:space-around;align-items:center;padding:0 10px}
.it{text-align:center;width:84px}
.ring{position:relative;width:76px;height:76px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{direction:ltr;position:absolute;inset:0;display:flex;justify-content:center;align-items:center;font-size:19px;font-weight:600;letter-spacing:-.5px}
.ring b small{font-size:10px;font-weight:600;margin-left:1px;margin-top:4px}
.l{font-size:12px;font-weight:600;margin-top:8px}.s{font-size:10.5px;color:var(--text2);font-weight:500;margin-top:1px}
.bars{align-items:stretch!important;display:flex;flex-direction:column;justify-content:center;gap:11px;padding:0 20px}.br{width:100%;display:flex;align-items:center;gap:10px}.br b{width:62px;white-space:nowrap;font-size:12px;font-weight:600}.trk{flex:1;height:8px;border-radius:4px;background:rgba(128,128,128,.22);overflow:hidden;direction:ltr}.trk i{display:block;height:100%;border-radius:4px;transition:width .8s}.br span{white-space:nowrap;width:auto;width:44px!important;font-size:11px;color:var(--text2);text-align:left;direction:ltr;font-variant-numeric:tabular-nums}</style>
<body><div class=widget id=w></div>
<script>
const q=new URLSearchParams(location.search);
document.documentElement.dataset.theme=q.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const R=32,C=2*Math.PI*R;
const defs=[['cpu','מעבד','#ff453a'],['mem','זיכרון','#30d158'],['disk','דיסק','#0a84ff'],['up','פעילות','#ff9f0a']];
const w=document.getElementById('w');const bars=q.get('style')==='bars';if(bars)w.className='widget bars';
const els={};
for(const[k,l,col]of defs){const d=document.createElement('div');d.className=bars?'br':'it';if(bars){d.innerHTML=`<b>${l}</b><div class=trk><i style="background:${col};width:0"></i></div><span></span>`;w.appendChild(d);els[k]={bar:d.querySelector("i"),sp:d.querySelector('span')};continue}
 d.innerHTML=`<div class=ring><svg viewBox="0 0 76 76"><circle cx=38 cy=38 r=${R} fill=none stroke="rgba(128,128,128,.2)" stroke-width=7 /><circle class=a cx=38 cy=38 r=${R} fill=none stroke="${col}" stroke-width=7 stroke-linecap=round stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset .8s ease"/></svg><b></b></div><div class=l>${l}</div><div class=s></div>`;
 w.appendChild(d);els[k]={a:d.querySelector('.a'),b:d.querySelector('b'),s:d.querySelector('.s')}}
const gb=x=>(x/1073741824).toFixed(1)+' GB';
function set(k,p,txt,sub,unit='%'){if(bars){els[k].bar.style.width=Math.min(100,p)+'%';els[k].sp.innerHTML=txt+(unit||'')+'';return}
 els[k].a.style.strokeDashoffset=C*(1-Math.min(1,p/100));els[k].b.innerHTML=txt+(unit?`<small>${unit}</small>`:'');els[k].s.innerHTML=sub}
function render(s){set('cpu',s.cpu,s.cpu,'');
 const mp=Math.round(100*s.mem.used/s.mem.total);set('mem',mp,mp,'<bdi dir=ltr>'+gb(s.mem.used)+' / '+gb(s.mem.total)+'</bdi>');
 if(s.disk){const u=s.disk.total-s.disk.free,dp=Math.round(100*u/s.disk.total);set('disk',dp,dp,'<bdi dir=ltr>'+gb(s.disk.free)+'</bdi> פנויים')}
 const h=Math.floor(s.uptime/3600),d=Math.floor(h/24);set('up',Math.min(100,h%24/24*100),d?d+'י׳':h,d?(h%24)+' שע׳':'שעות','');}
if(q.get('demo'))render({cpu:23,mem:{used:9.4*1073741824,total:16*1073741824},disk:{total:512e9,free:231e9},uptime:3*86400+5*3600});
else{const tick=()=>api.stats().then(render);tick();setInterval(tick,2000)}
</script>
