<!doctype html><meta charset=utf-8><html lang=he dir=rtl><link rel=stylesheet href="../../shared/theme.css">
<style>
/* regular card mode */
.widget{display:flex;flex-direction:column;padding:12px 14px}
.chdr{font-size:12px;font-weight:600;color:var(--text2);padding-bottom:6px}
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.bub{max-width:85%;padding:7px 11px;border-radius:15px;font-size:12.5px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.bub.out{align-self:flex-start;background:#0a84ff;color:#fff;border-bottom-left-radius:5px}
.bub.in{align-self:flex-end;background:#e9e9eb;color:#1c1c1e;border-bottom-right-radius:5px}
[data-theme=dark] .bub.in{background:#3a3a3c;color:#fff}
.meta{font-size:9.5px;color:var(--text2);align-self:flex-start;margin-top:-4px}
.bub{cursor:pointer}
#toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:rgba(20,20,22,.92);color:#fff;font-size:10.5px;padding:5px 12px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.meta.fail{color:#ff453a}
.hint{font-size:10px;color:var(--text2);text-align:center;padding:3px}
.composer{display:flex;gap:6px;padding-top:8px}
.composer{align-items:flex-end}
.composer textarea{flex:1;border:0;border-radius:11px;background:rgba(128,128,128,.14);color:var(--text);font:400 12.5px var(--font);padding:8px 11px;outline:0;resize:none;line-height:1.3;max-height:78px;overflow-y:auto;font-family:var(--font)}
.composer button{border:0;border-radius:11px;background:#0a84ff;color:#fff;font:600 12.5px var(--font);padding:8px 14px;cursor:pointer}
.composer button:disabled{opacity:.5;cursor:default}
/* dynamic island mode */
body.island{background:transparent}
body.island .widget{position:static;inset:auto;background:transparent;backdrop-filter:none;box-shadow:none;padding:0;overflow:visible}
#pill{position:absolute;top:0;left:50%;transform:translateX(-50%);min-width:70px;max-width:360px;border-radius:12px;background:rgba(12,12,14,.92);box-shadow:0 4px 18px rgba(0,0,0,.35),0 0 0 .5px rgba(255,255,255,.08) inset;color:#fff;overflow:hidden;transition:min-width .28s cubic-bezier(.32,.72,.35,1),max-height .32s cubic-bezier(.32,.72,.35,1),border-radius .3s;max-height:24px;cursor:pointer;backdrop-filter:blur(30px) saturate(160%)}
#pillHead{display:flex;align-items:center;gap:4px;height:24px;padding:0 8px;white-space:nowrap;transition:height .28s cubic-bezier(.32,.72,.35,1),padding .28s cubic-bezier(.32,.72,.35,1),gap .28s}
#pillHead .av{width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:grid;place-items:center;font-size:7px;transition:width .28s cubic-bezier(.32,.72,.35,1),height .28s cubic-bezier(.32,.72,.35,1),font-size .28s}
#pillHead .who{font:600 9px var(--font);transition:font-size .28s cubic-bezier(.32,.72,.35,1)}
#pillHead .st{font:400 7.5px var(--font);color:rgba(235,235,245,.55);transition:font-size .28s cubic-bezier(.32,.72,.35,1)}
#pillHead .dot{width:4px;height:4px;border-radius:50%;background:#30d158;flex:none;box-shadow:0 0 5px rgba(48,209,88,.7);transition:width .28s,height .28s}
#pillBody{display:block;overflow:hidden;max-height:0;opacity:0;padding:0 14px;transition:max-height .3s cubic-bezier(.32,.72,.35,1),opacity .22s ease,padding .3s cubic-bezier(.32,.72,.35,1)}
#pill.alert{min-width:110px;max-height:40px;border-radius:20px}
#pill.alert #pillHead{gap:6px;height:40px;padding:0 12px}
#pill.alert .av{width:20px;height:20px;font-size:10.5px}
#pill.alert .who{font-size:11.5px}
#pill.alert .st{font-size:9px}
#pill.alert .dot{width:6px;height:6px}
#pill.open #pillHead{gap:8px;height:56px;padding:0 18px}
#pill.open .av{width:26px;height:26px;font-size:13px}
#pill.open .who{font-size:13px}
#pill.open .st{font-size:10.5px}
#pill.open .dot{width:8px;height:8px}
#pill.open{min-width:340px;max-height:330px;border-radius:24px;cursor:default}
#pill.open #pillBody{max-height:270px;opacity:1;padding:0 14px 12px}
#pill:not(.open) #pillBody{contain:size}
#pill .log{max-height:200px}
#pill .bub{font-size:12px}
#pill .bub.in{background:#3a3a3c;color:#fff}
#pill .composer textarea{background:rgba(255,255,255,.12);color:#fff}
#pill .hint{color:rgba(235,235,245,.45)}
#pill .meta{color:rgba(235,235,245,.45)}
</style>
<body><div class=widget>
<div id=toast>הועתק</div>
<div id=pill><div id=pillHead class=nd><span class=av>ח</span><span class=who>חיים שלי</span><span class=dot id=dot style="display:none"></span><span class=st id=pillSt></span></div><div id=pillBody></div></div>
<div id=card style="display:none;flex:1;flex-direction:column;min-height:0">
 <div class=chdr>חיים</div>
 <div class=log id=log></div>
 <div class=hint id=hint style="display:none">תשובות מגיעות עד ~5 דקות · המסך הזה שומר את השיחה במחשב בלבד</div>
 <div class="composer nd"><textarea id=txt rows=1 maxlength=2000 placeholder="כתוב לחיים…"></textarea><button id=send>שלח</button></div>
</div>
</div>
<script src="../../shared/widget.js"></script>
<script>
const q=new URLSearchParams(location.search);
document.documentElement.dataset.theme=q.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const island=q.get('size')==='island';
const $=i=>document.getElementById(i);
let H={messages:[],seenHint:false,lastReceived:0};
let pollTimer=null;
function lastMsg(){return H.messages[H.messages.length-1]}
function awaitingHis(){const l=lastMsg();return !!l&&l.dir==='out'}
function waitingForMe(){const l=lastMsg();return !!l&&l.dir==='in'}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function statusText(m){if(m.dir!=='out')return'';if(m.status==='failed')return'לא נשלח · אין חיבור';const i=H.messages.indexOf(m);return H.messages.slice(i+1).some(x=>x.dir==='in')?'נענה':'נשלח'}
let toastT=null;function copyMsg(t){const done=()=>{toast.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>toast.style.opacity=0,900)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(done);else{const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();try{document.execCommand('copy')}catch{}ta.remove();done()}}
function bubble(m){const d=document.createElement('div');d.className='bub '+m.dir;d.dir='auto';d.textContent=m.text;d.title='לחץ להעתקה';d.onclick=()=>copyMsg(m.text);const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column';wrap.append(d);const t=statusText(m);if(t){const mt=document.createElement('div');mt.className='meta'+(m.status==='failed'?' fail':'');mt.textContent=t;wrap.append(mt)}return wrap}
function updatePillSt(netErr){if(netErr){pillSt.textContent='אין חיבור';return}pillSt.textContent=unread?'יש תשובה':waitingForMe()?'מחכה לתשובה…':''}
function render(into){into.innerHTML='';for(const m of H.messages.slice(-60))into.append(bubble(m));into.scrollTop=into.scrollHeight;updatePillSt()}
async function save(){try{await api.chatSave(H)}catch{}}
async function poll(){if(!window.api)return;const r=await api.chatPoll(awaitingHis()?'':(H.lastReceived||''));
 if(!r.ok){if(island)updatePillSt(true);return}
 updatePillSt();
 let changed=false;for(const m of r.messages||[]){if(H.messages.some(x=>x.id===m.id))continue;
  H.messages.push({id:m.id,dir:'in',text:m.text,at:m.at,received_at:m.received_at,status:'sent',in_reply_to:m.in_reply_to});
  H.lastReceived=Math.max(H.lastReceived||0,m.received_at||0);changed=true}
 if(changed){await save();render(log);if(island)newReply()}}
function grow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,78)+'px'}
function wireComposer(el,fn){el.addEventListener('input',()=>grow(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();fn(el)}})}
async function doSend(){const t=txt.value.trim();if(!t)return;send.disabled=true;txt.disabled=true;
 const r=await api.chatSend(t);
 if(r.ok){const m={id:r.id,dir:'out',text:t,at:Date.now(),status:'sent'};H.messages.push(m);txt.value='';grow(txt);
  if(!H.seenHint){H.seenHint=true;hint.style.display=''}
  await save();render(log)}
 else{H.messages.push({id:'local-'+Date.now(),dir:'out',text:t,at:Date.now(),status:'failed'});await save();render(log)}
 send.disabled=false;txt.disabled=false;txt.focus();setTimeout(poll,3000)}
function newReply(){if(!island)return;if(pillMode!=='open'){pillMode='alert';pill.classList.add('alert');setUnread(true);updatePillSt()}else render(pillBodyLog())}
/* island behavior */
let pillMode='mini',unread=false;
function setUnread(v){unread=v;dot.style.display=v?'':'none'}
function openPill(){pillMode='open';setUnread(false);pill.classList.add('open');pill.classList.remove('alert');render(pillBodyLog());api.chatPassthrough(false)}
function closePill(){pillMode='mini';pill.classList.remove('open','alert');api.chatPassthrough(true)}
function pillBodyLog(){let l=$('pillLog');if(!l){pillBody.innerHTML='';l=document.createElement('div');l.className='log';l.id='pillLog';const comp=card.querySelector('.composer').cloneNode(true);comp.querySelector('textarea').id='txt2';comp.querySelector('button').id='send2';comp.querySelector('button').onclick=()=>islandSend(comp);wireComposer(comp.querySelector('textarea'),()=>islandSend(comp));pillBody.append(l,comp)}return l}
async function islandSend(comp){const inp=comp.querySelector('textarea');const t=inp.value.trim();if(!t)return;inp.value='';grow(inp);txt.value=t;await doSend();render(pillBodyLog())}
if(island){document.body.classList.add('island');card.style.display='none';pill.style.display='';
 pillHead.onclick=()=>{pillMode==='open'?closePill():openPill()};
 pill.addEventListener('mouseleave',()=>{if(pillMode!=='open')api.chatPassthrough(true)});
 document.addEventListener('mousemove',e=>{if(!pill.contains(e.target)&&pillMode!=='open')api.chatPassthrough(true)});
 pill.addEventListener('mouseenter',()=>api.chatPassthrough(false));
 document.addEventListener('mousedown',e=>{if(pillMode==='open'&&!pill.contains(e.target))closePill()});
 window.addEventListener('blur',()=>{if(pillMode==='open')closePill()});
}else{pill.style.display='none';card.style.display='flex';send.onclick=doSend;wireComposer(txt,()=>doSend())}
(async()=>{if(!window.api)return;H=await api.chatHistory()||H;if(H.seenHint)hint.style.display='none';else if(H.messages.length)H.seenHint=true;
 window.__poll=poll;
 render(island?pillBodyLog():log);await poll();pollTimer=setInterval(poll,25000)})();
</script>
