<!doctype html><meta charset=utf-8><html lang=he dir=rtl><link rel=stylesheet href="../../shared/theme.css">
<style>
/* regular card mode */
.widget{display:flex;flex-direction:column;padding:12px 14px}
.chdr{font-size:12px;font-weight:600;color:var(--text2);padding-bottom:6px}
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.bub{max-width:85%;padding:7px 11px;border-radius:15px;font-size:12.5px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.bub.out{align-self:flex-start;background:#0a84ff;color:#fff;border-bottom-left-radius:5px}
.bub.in{align-self:flex-end;background:#e9e9eb;color:#1c1c1e;border-bottom-right-radius:5px}
[data-theme=dark] .bub.in{background:#3a3a3c;color:#fff}
.meta{font-size:9.5px;color:var(--text2);align-self:flex-start;margin-top:1px}
.card{align-self:stretch;max-width:95%;background:#e9e9eb;color:#1c1c1e;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;animation:cardIn .3s cubic-bezier(.32,.72,.35,1)}
[data-theme=dark] .card{background:#3a3a3c;color:#fff}
.card .ct{font:600 12.5px var(--font)}
.card .cb{font:400 12px var(--font);white-space:pre-wrap;word-break:break-word;opacity:.85}
.card .cbtns{display:flex;gap:6px;flex-wrap:wrap}
.card button{border:0;border-radius:9px;font:600 11.5px var(--font);padding:6px 12px;cursor:pointer;transition:opacity .15s,transform .1s}
.card button.bp{background:#0a84ff;color:#fff}
.card button.bd{background:#ff453a;color:#fff}
.card button.bl{background:rgba(128,128,128,.18);color:#1c1c1e}
[data-theme=dark] .card button.bl{color:#fff}
.card button:hover{opacity:.85}.card button:active{transform:scale(.96)}
.card.busy button{pointer-events:none;opacity:.45}.card.busy button.sel{opacity:1}
.card.acted{opacity:.55}.card.acted button{pointer-events:none;opacity:.45}.card.acted button.sel{opacity:1}
.filebox{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:rgba(128,128,128,.12);border-radius:10px;padding:9px 11px}
.filebox .fic{font-size:24px;line-height:1}
.filebox .fmid{flex:1;min-width:120px}
.filebox .fname{font:600 12.5px var(--font);word-break:break-all}
.filebox .fsize{font:400 11px var(--font);opacity:.65;margin-top:1px}
.filebox .cbtns{width:100%}
.filebox.busy{opacity:.5;pointer-events:none}
.reactpop{position:fixed;z-index:60;display:flex;gap:2px;background:#fff;border-radius:20px;box-shadow:0 6px 24px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08);padding:4px 6px;animation:cardIn .15s ease}
.reactpop button{border:0;background:none;font-size:19px;padding:3px 5px;border-radius:14px;cursor:pointer;transition:transform .1s}
.reactpop button:hover{transform:scale(1.25);background:rgba(128,128,128,.12)}
.reactpop button.sel{background:rgba(10,132,255,.18)}
[data-theme=dark] .reactpop{background:#2c2c2e}
.reactb{position:absolute;bottom:-8px;inset-inline-end:2px;background:#fff;border-radius:10px;font-size:12px;line-height:1.5;padding:0 4px;box-shadow:0 1px 4px rgba(0,0,0,.25);z-index:2;pointer-events:none}
[data-theme=dark] .reactb{background:#2c2c2e}
@keyframes cardIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.meta.in{align-self:flex-end}
.bub{cursor:pointer}
.bub a,.cb a,#pillPrev a{color:#0a84ff;text-decoration:underline;cursor:pointer}
.bub.out a{color:#cce4ff}
#toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:rgba(20,20,22,.92);color:#fff;font-size:10.5px;padding:5px 12px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.meta.fail{color:#ff453a}
.hint{font-size:10px;color:var(--text2);text-align:center;padding:3px}
.composer{display:flex;gap:6px;padding-top:8px}
.composer{align-items:flex-end}
.composer textarea{flex:1;border:0;border-radius:11px;background:rgba(128,128,128,.14);color:var(--text);font:400 12.5px var(--font);padding:8px 11px;outline:0;resize:none;line-height:1.3;max-height:78px;overflow-y:auto;font-family:var(--font)}
.composer button{border:0;border-radius:11px;background:#0a84ff;color:#fff;font:600 12.5px var(--font);padding:8px 14px;cursor:pointer}
.composer button:disabled{opacity:.5;cursor:default}
/* dynamic island mode */
body.island{background:transparent}
body.island .widget{position:static;inset:auto;background:transparent;backdrop-filter:none;box-shadow:none;padding:0;overflow:visible}
#pill{position:absolute;top:0;left:50%;transform:translateX(-50%);min-width:70px;max-width:360px;border-radius:12px;background:rgba(12,12,14,.95);box-shadow:0 4px 18px rgba(0,0,0,.35),0 0 0 .5px rgba(255,255,255,.08) inset;color:#fff;overflow:hidden;transition:min-width .28s cubic-bezier(.32,.72,.35,1),max-height .32s cubic-bezier(.32,.72,.35,1),border-radius .3s;max-height:24px;cursor:pointer;backdrop-filter:blur(30px) saturate(160%)}
#pillHead{display:flex;align-items:center;gap:4px;height:24px;padding:0 8px;white-space:nowrap;transition:height .28s cubic-bezier(.32,.72,.35,1),padding .28s cubic-bezier(.32,.72,.35,1),gap .28s}
#brandBtn{display:inline-flex;align-items:center;gap:4px;cursor:pointer;border-radius:8px;padding:1px 3px;margin-right:-3px}
#brandBtn:hover{background:rgba(255,255,255,.1)}
#pill.open #brandBtn{gap:8px}
#pillHead .av{width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:grid;place-items:center;font-size:7px;transition:width .28s cubic-bezier(.32,.72,.35,1),height .28s cubic-bezier(.32,.72,.35,1),font-size .28s}
#pillHead .who{font:600 9px var(--font);transition:font-size .28s cubic-bezier(.32,.72,.35,1)}
#pillHead .st{font:400 7.5px var(--font);color:rgba(235,235,245,.55);transition:font-size .28s cubic-bezier(.32,.72,.35,1)}
#pillHead .dot{width:4px;height:4px;border-radius:50%;background:#30d158;flex:none;box-shadow:0 0 5px rgba(48,209,88,.7);transition:width .28s,height .28s}
#gearBtn{display:none;width:20px;height:20px;border-radius:10px;background:rgba(255,255,255,.14);color:rgba(235,235,245,.85);font-size:12px;line-height:20px;text-align:center;cursor:pointer;flex:none}
#gearBtn:hover{background:rgba(255,255,255,.26)}
#pill.open #gearBtn{display:block}
#pillBody{display:block;overflow:hidden;max-height:0;opacity:0;padding:0 14px;transition:max-height .3s cubic-bezier(.32,.72,.35,1),opacity .22s ease,padding .3s cubic-bezier(.32,.72,.35,1)}
#pill.alert{min-width:110px;max-height:40px;border-radius:20px}
#pill.alert .st{max-width:190px;overflow:hidden;text-overflow:ellipsis}
@keyframes pillBump{0%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1)}}
#pill.bump{animation:pillBump .55s ease}
#pillPrev{display:none;direction:rtl;padding:0 13px;font-size:12px;line-height:1.45;color:rgba(235,235,245,.92);overflow:hidden;overflow-y:auto;max-height:0;opacity:0;white-space:pre-wrap;word-break:break-word;scroll-behavior:smooth;scrollbar-width:none;transition:max-height .35s cubic-bezier(.32,.72,.35,1),opacity .25s ease}
#pillPrev::-webkit-scrollbar{display:none}
#pillPrev.more{-webkit-mask-image:linear-gradient(to bottom,#000 76%,transparent 99%);mask-image:linear-gradient(to bottom,#000 76%,transparent 99%)}
#pill.preview{max-height:290px;min-width:250px;border-radius:20px}
#pill.preview #pillPrev{display:block;opacity:1;padding-bottom:10px}
#pill.preview #pillPrev{cursor:pointer}
#pill.alert #pillHead{gap:6px;height:40px;padding:0 12px}
#pill.alert .av{width:20px;height:20px;font-size:10.5px}
#pill.alert .who{font-size:11.5px}
#pill.alert .st{font-size:9px}
#pill.alert .dot{width:6px;height:6px}
#pill.open #pillHead{gap:8px;height:56px;padding:0 18px}
#pill.open .av{width:26px;height:26px;font-size:13px}
#pill.open .who{font-size:13px}
#pill.open .st{font-size:10.5px}
#pill.open .dot{width:8px;height:8px}
#pill.open{min-width:340px;max-height:330px;border-radius:24px;cursor:default}
#pill.open #pillBody{max-height:270px;opacity:1;padding:0 14px 12px}
#pill:not(.open) #pillBody{contain:size}
#pill .log{max-height:200px}
#pill .bub{font-size:12px}
#pill .bub.in{background:#3a3a3c;color:#fff}
#pill .composer{background:rgba(20,20,24,.72);border-radius:13px;padding:6px;margin:8px -6px -4px}
#pill .composer textarea{background:rgba(255,255,255,.22);color:#fff}
#pill .composer #scr2,#pill .composer #shot2{background:rgba(255,255,255,.22)!important;color:#fff}
#pill .hint{color:rgba(235,235,245,.45)}
#pill .meta{color:rgba(235,235,245,.45)}
[data-size=large] .chdr{font-size:15px}
[data-size=large] .bub{font-size:15.5px;padding:9px 13px}
[data-size=large] .meta{font-size:11px}
[data-size=large] .composer textarea{font-size:15px}
[data-size=large] .composer button{font-size:15px}
</style>
<body><div class=widget>
<div id=toast>הועתק</div>
<div id=pill><div id=pillHead class=nd><span id=brandBtn title="החיים שלי המחשבי - ניהול"><span class=av>ח</span></span><span class=who>חיים שלי</span><span class=dot id=dot style="display:none"></span><span class=st id=pillSt></span><span id=gearBtn title="הגדרות החיים שלי">⚙</span></div><div id=pillPrev class=nd></div><div id=pillBody></div></div>
<div id=card style="display:none;flex:1;flex-direction:column;min-height:0">
 <div class=chdr>חיים</div>
 <div class=log id=log></div>
 <div class=hint id=hint style="display:none">תשובות מגיעות עד ~5 דקות · המסך הזה שומר את השיחה במחשב בלבד</div>
 <div class="composer nd"><textarea id=txt rows=1 maxlength=2000 placeholder="כתוב לחיים…"></textarea><button id=scr title="בחר מסך לצילום" style="background:rgba(128,128,128,.18);color:var(--text);padding:8px 9px;font-size:11px;display:none">מסך 1</button><button id=shot title="צלם מסך" style="background:rgba(128,128,128,.18);color:var(--text);padding:8px 11px">📷</button><button id=send>שלח</button></div>
</div>
</div>
<script src="../../shared/widget.js"></script>
<script>
const q=new URLSearchParams(location.search);
document.documentElement.dataset.theme=q.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const island=q.get('size')==='island';
const $=i=>document.getElementById(i);
let H={messages:[],seenHint:false,lastReceived:0};
function incoming(m){if(!m||!m.id||H.messages.some(x=>x.id===m.id))return;
 H.messages.push({id:m.id,dir:'in',text:String(m.text||''),at:+m.at||0,received_at:+m.received_at||0,status:'sent',in_reply_to:String(m.in_reply_to||'')});
 if(m.received_at>0)H.lastReceived=Math.max(H.lastReceived||0,m.received_at);
 save();render(log);if(island&&!(m.received_at>0&&m.received_at<=readUpTo))newReply(H.messages[H.messages.length-1])}
function incomingCard(c){if(!c||!c.id||(H.cards||[]).some(x=>x.id===c.id))return;
 H.cards=H.cards||[];H.cards.push({id:String(c.id),title:String(c.title||''),body:String(c.body||''),buttons:Array.isArray(c.buttons)?c.buttons:[],graph:c.graph,file:c.file&&typeof c.file==='object'?{name:String(c.file.name||''),size:+c.file.size||0,mime:String(c.file.mime||''),url:String(c.file.url||''),path:String(c.file.path||'')}:undefined,at:+c.at||Date.now(),acted:false,actedButton:''});
 save();render(log);
 if(!island)return;
 if(pillMode==='open'){render(pillBodyLog());chime();if(document.hasFocus()){markRead()}else{setUnread(true)}focusComposer();return}
 setUnread(true);chime();pillMode='alert';pill.classList.add('alert','bump');updatePillSt();setTimeout(()=>pill.classList.remove('bump'),700);
 alertPreview=c.title||'כרטיס חדש';pillPrev.innerHTML=linkify(esc(alertPreview));wireLinks(pillPrev);pill.classList.add('preview');
 requestAnimationFrame(()=>{const lh=parseFloat(getComputedStyle(pillPrev).lineHeight)||17.4;const cap=Math.round(lh*10)+8;pillPrev.style.maxHeight=Math.min(pillPrev.scrollHeight+6,cap)+'px';pillPrev.classList.toggle('more',pillPrev.scrollHeight-6>cap)});
 if(window.api&&api.winNudge)api.winNudge();window.gwDragRefresh&&gwDragRefresh();
 clearTimeout(prevT);prevT=setTimeout(collapseAlert,4000)}
function lastMsg(){return H.messages[H.messages.length-1]}
function awaitingHis(){const l=lastMsg();return !!l&&l.dir==='out'}
function waitingReply(){const l=lastMsg();return !!l&&l.dir==='out'&&l.status!=='failed'}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function linkify(escaped){return escaped.replace(/https?:\/\/[^\s<>"']+/g,u=>'<a href=# data-u="'+u+'">'+u+'</a>')}
function wireLinks(el){for(const a of el.querySelectorAll('a[data-u]'))a.onclick=e=>{e.preventDefault();e.stopPropagation();if(window.api&&api.openExternal)api.openExternal(a.dataset.u)}}
function statusText(m){if(m.dir!=='out')return'';if(m.status==='failed')return'לא נשלח · אין חיבור';const i=H.messages.indexOf(m);return H.messages.slice(i+1).some(x=>x.dir==='in')?'נענה':'נשלח'}
let toastT=null;function copyMsg(t){const done=()=>{toast.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>toast.style.opacity=0,900)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(done);else{const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();try{document.execCommand('copy')}catch{}ta.remove();done()}}
function fmtT(ts){const d=new Date(+ts||0);if(isNaN(d)||!+ts)return'';return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
const REACTS=['👍','❤️','😂','😮','😢','🙏'];let reactPop=null;
function closeReact(){if(reactPop){reactPop.remove();reactPop=null}}
document.addEventListener('click',ev=>{if(reactPop&&!reactPop.contains(ev.target))closeReact()},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeReact()});
function openReact(m,anchor){closeReact();
 reactPop=document.createElement('div');reactPop.className='reactpop nd';
 for(const em of REACTS){const b=document.createElement('button');b.textContent=em;if(m.myReaction===em)b.classList.add('sel');b.title=em;
  b.onclick=ev=>{ev.stopPropagation();closeReact();pickReact(m,em)};reactPop.append(b)}
 document.body.append(reactPop);
 const r=anchor.getBoundingClientRect(),pw=reactPop.offsetWidth||220;
 reactPop.style.left=Math.max(4,Math.min(window.innerWidth-pw-4,r.left+r.width/2-pw/2))+'px';
 reactPop.style.top=Math.max(4,r.top-46)+'px'}
async function pickReact(m,em){const nv=m.myReaction===em?'':em;m.myReaction=nv;save();render(log);if(island&&pillMode==='open')render(pillBodyLog());
 try{await api.chatReact({message_id:m.id,emoji:nv})}catch{}} // optimistic locally; offline keeps the local reaction
function bubble(m){const d=document.createElement('div');d.className='bub nd '+m.dir;d.dir='auto';d.innerHTML=linkify(esc(m.text));wireLinks(d);d.title='לחץ להעתקה';d.onclick=()=>copyMsg(m.text);d.ondblclick=ev=>{ev.stopPropagation();openReact(m,wrap)};const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;position:relative';wrap.append(d);
 if(m.myReaction){const rb=document.createElement('span');rb.className='reactb';rb.textContent=m.myReaction;wrap.append(rb)}const t=[statusText(m),fmtT(m.at||m.received_at)].filter(Boolean).join(' · ');if(t){const mt=document.createElement('div');mt.className='meta'+(m.status==='failed'?' fail':'')+(m.dir==='in'?' in':'');mt.textContent=t;wrap.append(mt)}return wrap}
function updatePillSt(netErr){if(netErr){pillSt.textContent='אין חיבור';return}pillSt.textContent=unread&&pillMode==='alert'?'יש תשובה':''}
function timeline(){const items=H.messages.map(m=>({t:+m.at||+m.received_at||0,m}));for(const c of (H.cards||[]))items.push({t:+c.at||0,c});items.sort((a,b)=>a.t-b.t);return items.slice(-80)}
function graphSvg(g){const w=210,h=64,pad=6,vals=g.series.map(p=>+p.value||0),max=Math.max(...vals,1);
 const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.style.width='100%';svg.style.height='auto';
 if(g.type==='bar'){const bw=(w-pad*2)/vals.length;vals.forEach((v,i)=>{const bh=Math.max(2,(h-pad*2-12)*(v/max));const r=document.createElementNS(ns,'rect');
  r.setAttribute('x',pad+i*bw+2);r.setAttribute('y',h-pad-10-bh);r.setAttribute('width',Math.max(2,bw-4));r.setAttribute('height',bh);r.setAttribute('rx',2.5);r.setAttribute('fill','#0a84ff');svg.append(r);
  if(g.series[i].label){const t=document.createElementNS(ns,'text');t.setAttribute('x',pad+i*bw+bw/2);t.setAttribute('y',h-1);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','7');t.setAttribute('fill','currentColor');t.setAttribute('opacity','.6');t.textContent=String(g.series[i].label).slice(0,8);svg.append(t)}})}
 else{const pts=vals.map((v,i)=>[pad+i*(w-pad*2)/Math.max(1,vals.length-1),h-pad-(h-pad*2)*(v/max)]);
  const pl=document.createElementNS(ns,'polyline');pl.setAttribute('points',pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '));pl.setAttribute('fill','none');pl.setAttribute('stroke','#0a84ff');pl.setAttribute('stroke-width','2');pl.setAttribute('stroke-linejoin','round');svg.append(pl);
  for(const p of pts){const c=document.createElementNS(ns,'circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r','2.4');c.setAttribute('fill','#0a84ff');svg.append(c)}}
 return svg}
function cardEl(c){const d=document.createElement('div');d.className='card nd'+(c.busy?' busy':'')+(c.acted?' acted':'');d.dir='auto';d.dataset.cid=c.id;
 const t=document.createElement('div');t.className='ct';t.textContent=c.title;d.append(t);
 if(c.body){const b=document.createElement('div');b.className='cb';b.innerHTML=linkify(esc(c.body));wireLinks(b);d.append(b)}
 if(c.graph&&c.graph.series&&c.graph.series.length)d.append(graphSvg(c.graph));
 if(c.file&&c.file.name)d.append(fileBox(c));
 if(!c.file&&c.buttons&&c.buttons.length){const row=document.createElement('div');row.className='cbtns';
  for(const b of c.buttons){const btn=document.createElement('button');btn.className=b.style==='primary'?'bp':b.style==='danger'?'bd':'bl';btn.textContent=b.label;
   if(c.actedButton===b.id||c.busyButton===b.id)btn.classList.add('sel');
   btn.onclick=()=>cardClick(c,b,d);row.append(btn)}
  d.append(row)}
 return d}
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round((+n||0)/1024))+' KB';
const FILE_ICONS={pdf:'\u{1F4C4}',doc:'\u{1F4DD}',docx:'\u{1F4DD}',txt:'\u{1F4DD}',rtf:'\u{1F4DD}',odt:'\u{1F4DD}',png:'\u{1F5BC}\uFE0F',jpg:'\u{1F5BC}\uFE0F',jpeg:'\u{1F5BC}\uFE0F',gif:'\u{1F5BC}\uFE0F',webp:'\u{1F5BC}\uFE0F',heic:'\u{1F5BC}\uFE0F',mp3:'\u{1F3B5}',m4a:'\u{1F3B5}',wav:'\u{1F3B5}',mp4:'\u{1F3AC}',mov:'\u{1F3AC}',avi:'\u{1F3AC}',xls:'\u{1F4CA}',xlsx:'\u{1F4CA}',csv:'\u{1F4CA}',ppt:'\u{1F4FD}\uFE0F',pptx:'\u{1F4FD}\uFE0F',zip:'\u{1F5DC}\uFE0F',rar:'\u{1F5DC}\uFE0F'};
const fileIcon=n=>FILE_ICONS[(String(n||'').split('.').pop()||'').toLowerCase()]||'\u{1F4CE}';
function fileBox(c){const f=c.file,box=document.createElement('div');box.className='filebox';box.dir='auto';
 const ic=document.createElement('div');ic.className='fic';ic.textContent=fileIcon(f.name);
 const mid=document.createElement('div');mid.className='fmid';
 const nm=document.createElement('div');nm.className='fname';nm.textContent=f.name;
 const sz=document.createElement('div');sz.className='fsize';sz.textContent=[f.size?fmtSize(f.size):'',f.mime||''].filter(Boolean).join(' · ');
 mid.append(nm,sz);
 const row=document.createElement('div');row.className='cbtns';
 const flash=t=>{toast.textContent=t;toast.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>toast.style.opacity=0,2200)};
 const mk=(label,cls,fn)=>{const b=document.createElement('button');b.className=cls;b.textContent=label;
  b.onclick=async()=>{if(box.classList.contains('busy'))return;box.classList.add('busy');let r=null;try{r=await fn()}catch{}box.classList.remove('busy');
   flash(r&&r.ok?(r.saved_to?'נשמר להורדות: '+r.saved_to.split(/[\\/]/).pop():'נפתח'):('לא הצלחתי - '+(r&&r.error||'אין חיבור')))};
  return b};
