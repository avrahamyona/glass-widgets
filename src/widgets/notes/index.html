<!doctype html><html lang=he dir=rtl><meta charset=utf-8><link rel=stylesheet href="../../shared/theme.css"><style>.widget{display:flex;flex-direction:column}.bar{background:#ffd60a;color:#584600;font-size:12px;font-weight:700;padding:9px 14px;flex:none}.content{padding:9px 14px;flex:1;min-height:0;overflow:auto;font-size:12px;line-height:1.45}.title{font-size:14px;font-weight:700;margin-bottom:5px}.text{white-space:pre-wrap;user-select:text}.meta{font-size:9px;color:var(--text2);padding:4px 12px;border-top:.5px solid #8883}.buttons{display:flex;gap:4px;padding:5px 10px}button{font:500 10px var(--font);border:0;border-radius:6px;background:#8882;color:var(--text);padding:5px;cursor:pointer}select{font:500 11px var(--font);border:0;background:transparent;color:var(--text);max-width:100%}.empty{font-size:11px;color:var(--text2);line-height:1.5}</style><body><div class=widget><div class=bar>פתקים · iCloud</div><div id=connBox style="display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px"><div style="font-size:12px;color:var(--text2)">לא מחובר ל-iCloud</div><button class=nd onclick="api.settingsOpen()" style="border:0;border-radius:8px;background:#0a84ff;color:#fff;font:600 11px var(--font);padding:7px 14px;cursor:pointer">התחבר</button></div><div class="content nd" id=main><select id=choice></select><div class=title id=title></div><div class=text id=text></div></div><div class=meta id=meta>ניסיוני · קריאה בלבד</div><div class="buttons nd"><button id=refresh>עדכן</button><button onclick="api.settingsOpen()">חיבור</button><button id=local>מקומי</button><button onclick="api.cloudOpen('notes')">ערוך באתר</button></div></div><script>
const q=new URLSearchParams(location.search);document.documentElement.dataset.theme=q.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');let notes=[],selected='';
function draw(r){const conn=!!r.connected;connBox.style.display=conn?'none':'flex';main.style.display=conn?'':'none';if(!conn){meta.textContent='קריאה בלבד · לא מחובר';return}notes=r.notes||[];choice.replaceChildren();for(const n of notes){const o=document.createElement('option');o.value=n.id;o.textContent=n.title||'ללא כותרת';choice.append(o)}if(notes.some(n=>n.id===selected))choice.value=selected;choice.style.display=notes.length>1?'':'none';show();meta.innerHTML='<span style="color:#34c759">●</span> קריאה בלבד · '+(r.at?new Date(r.at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jerusalem'}):'לא עודכן')+(r.stale?' · מידע שמור':'');if(r.errors?.notes){text.textContent=r.errors.notes;meta.textContent+=' · שגיאה'}if(!notes.length){title.textContent='אין פתקים';text.textContent=r.error||'אין פתקים להצגה. הפתק המקומי הישן נשאר שמור במחשב.'}}
function show(){const n=notes.find(n=>n.id===choice.value)||notes[0];if(!n)return;selected=n.id;title.textContent=n.title||'ללא כותרת';text.textContent=n.error||n.text||''}choice.onchange=async()=>{show();await api.instanceSelfSave({noteId:selected})};local.onclick=async()=>{title.textContent='הפתק המקומי מהגרסה הקודמת';choice.style.display='none';text.textContent=await api.notesGet();meta.textContent='מקומי בלבד · אינו מועלה ל-iCloud'};refresh.onclick=async()=>{refresh.disabled=true;meta.textContent='קורא מידע…';try{draw(await api.icloudRefresh())}finally{refresh.disabled=false}};
if(q.get('demo'))draw({connected:true,notes:[{id:'sample',title:'לקראת השבוע',text:'לעבור על רשימת המשימות\nלהוסיף רעיונות לפרויקט\nלהכין רשימת קניות'}],at:Date.now()});else{const load=()=>api.icloudData().then(draw);api.instanceSelf().then(c=>{selected=c?.noteId||'';load()});setInterval(load,5000)}
</script><script src="../../shared/widget.js"></script>
