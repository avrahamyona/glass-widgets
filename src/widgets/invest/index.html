<!doctype html><html lang=he dir=rtl><meta charset=utf-8><link rel=stylesheet href="../../shared/theme.css">
<style>
.widget{padding:14px 15px;display:flex;flex-direction:column;background:#1c1c1e;color:white}
.heading{font-size:13px;font-weight:700;margin-bottom:4px}.stamp{font-size:9px;color:#98989e;margin-top:auto;padding-top:5px;text-align:right}
.list{flex:1;overflow:hidden}.row{display:flex;gap:10px;align-items:center;padding:3px 0;border-bottom:.5px solid #454548}.row:last-child{border:0}.identity{min-width:0;flex:1}.identity b{font-size:14px;font-weight:700;display:block;direction:ltr;text-align:right}.identity small{display:block;font-size:8px;color:#98989e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.value{direction:ltr;text-align:left;flex:none}.value b{display:block;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:1px}.change{display:inline-block;border-radius:5px;background:#30d158;color:#000;min-width:64px;font-size:10px;font-weight:600;padding:2px 5px;text-align:center;direction:ltr}.down{background:#ff453a;color:#fff}.spark{width:66px;height:25px;flex:none;overflow:visible}.empty{color:#98989e;font-size:12px;padding:12px 0;line-height:1.5}
[data-size=square] .row:nth-child(n+2){display:none}[data-size=square] .row{flex-wrap:wrap;border:0;padding:0;gap:3px}[data-size=square] .identity{width:100%;flex:auto}[data-size=square] .identity b{font-size:21px}[data-size=square] .value b{font-size:22px}[data-size=square] .spark{width:100%;height:36px;order:3;margin-top:4px}[data-size=square] .heading{font-size:10px;color:#98989e;margin-bottom:4px}[data-size=square] .stamp{font-size:8px}
</style><body><div class=widget><div class=heading>מניות</div><div class=list id=list></div><div class=stamp id=stamp></div></div>
<script>
const q=new URLSearchParams(location.search);document.documentElement.dataset.size=q.get('size')||'rectangle';
const num=v=>Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function chart(values,color){const v=(values||[]).filter(Number.isFinite);if(v.length<2)return null;const lo=Math.min(...v),hi=Math.max(...v),range=hi-lo||1;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('spark');svg.setAttribute('viewBox','0 0 100 40');svg.setAttribute('preserveAspectRatio','none');const path=document.createElementNS(svg.namespaceURI,'polyline');path.setAttribute('points',v.map((y,i)=>(i/(v.length-1)*100).toFixed(1)+','+(36-(y-lo)/range*32).toFixed(1)).join(' '));path.setAttribute('fill','none');path.setAttribute('stroke',color);path.setAttribute('stroke-width','2');path.setAttribute('vector-effect','non-scaling-stroke');svg.append(path);return svg}
function render(items){list.replaceChildren();if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='הוסף מניות בהגדרות האפליקציה';list.append(e)}
for(const item of items.slice(0,2)){const row=document.createElement('div');row.className='row';row.style.cursor='pointer';row.title='פתח ב-Google Finance';row.onclick=()=>window.api&&api.invOpen(item.sym);const name=document.createElement('div');name.className='identity';const b=document.createElement('b');b.textContent=item.sym;const small=document.createElement('small');small.textContent=item.error?'אין נתונים כרגע':item.name;name.append(b,small);row.append(name);
if(!item.error){const positive=item.pct>=0;const svg=chart(item.chart,positive?'#30d158':'#ff453a');if(svg)row.append(svg);const val=document.createElement('div');val.className='value';const price=document.createElement('b');price.textContent=num(item.price);const change=document.createElement('span');change.className='change'+(positive?'':' down');change.textContent=(positive?'+':'')+num(item.pct)+'%';val.append(price,change);row.append(val)}list.append(row)}stamp.textContent='Yahoo · '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jerusalem'})+' · עשוי להתעכב'}
if(q.get('demo'))render([{sym:'AAPL',name:'Apple Inc. · USD',price:221.72,pct:1.34,chart:[212,216,213,218,219,217,221,220,222]},{sym:'MSFT',name:'Microsoft · USD',price:425.52,pct:-.62,chart:[431,429,432,427,428,424,425]},{sym:'^GSPC',name:'S&P 500 · USD',price:5680.25,pct:.41,chart:[5640,5650,5643,5660,5655,5670,5680]}]);else{const load=async()=>{try{render(await api.invGet())}catch{stamp.textContent='אין חיבור · נסה שוב מאוחר יותר'}};load();setInterval(load,60000)}
</script><script src="../../shared/widget.js"></script>
