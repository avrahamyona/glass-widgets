<!doctype html><meta charset=utf-8><link rel=stylesheet href="../../shared/theme.css">
<style>
.widget{background:linear-gradient(180deg,#2f6fb8 0%,#5aa0e0 100%);color:#fff;padding:15px 16px;display:flex;flex-direction:column}
[data-theme=dark] .widget{background:linear-gradient(180deg,#1b3a63 0%,#2f5f94 100%)}
.city{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:flex-start}
.t{font-size:52px;font-weight:300;letter-spacing:-2px;line-height:1;margin-top:2px}
.bot{margin-top:auto}.c{font-size:13px;font-weight:600}.hl{font-size:12.5px;font-weight:500;opacity:.9}
svg.ic{width:26px;height:26px}
</style>
<body><div class=widget><div class=city><span id=city></span><span id=icon></span></div><div class=t id=t>--°</div>
<div class=bot><div class=c id=c>Loading</div><div class=hl id=hl></div></div></div>
<script>
const q=new URLSearchParams(location.search);
document.documentElement.dataset.theme=q.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const sun='<circle cx=12 cy=12 r=4.6 fill="#ffd60a"/><g stroke="#ffd60a" stroke-width=1.8 stroke-linecap=round>'+[0,45,90,135,180,225,270,315].map(a=>`<line x1=12 y1=2.2 x2=12 y2=4.4 transform="rotate(${a} 12 12)"/>`).join('')+'</g>';
const cloud='<path d="M7 19a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5 4.8 4.8 0 0 1 17.5 19z" fill="#fff"/>';
const ICONS={clear:sun,cloud:cloud,pcloud:'<g transform="translate(-4 -5) scale(.7)">'+sun+'</g><g transform="translate(3 3) scale(.8)">'+cloud+'</g>',
 rain:cloud+'<g stroke="#9fd1ff" stroke-width=2 stroke-linecap=round><line x1=8 y1=21 x2=7 y2=23.5 /><line x1=12.5 y1=21 x2=11.5 y2=23.5 /><line x1=17 y1=21 x2=16 y2=23.5 /></g>',
 snow:cloud+'<g fill="#fff"><circle cx=8 cy=22 r=1.3 /><circle cx=12.5 cy=22 r=1.3 /><circle cx=17 cy=22 r=1.3 /></g>',
 storm:cloud+'<path d="M12.5 15l-3 5h3l-1 4 4.5-6h-3l1.5-3z" fill="#ffd60a"/>',fog:cloud};
function kind(c){if(c===0)return['clear','Clear'];if(c<=2)return['pcloud','Partly Cloudy'];if(c===3)return['cloud','Cloudy'];if(c<=48)return['fog','Foggy'];if(c<=67||(c>=80&&c<=82))return['rain','Rain'];if(c<=77||c>=85&&c<=86)return['snow','Snow'];return['storm','Thunderstorms']}
function show(t,code,hi,lo,name){const[k,l]=kind(code);document.getElementById('city').textContent=name;document.getElementById('t').textContent=Math.round(t)+'°';
 document.getElementById('c').textContent=l;document.getElementById('hl').textContent='H:'+Math.round(hi)+'°  L:'+Math.round(lo)+'°';
 document.getElementById('icon').innerHTML='<svg class=ic viewBox="0 0 24 26">'+ICONS[k]+'</svg>'}
async function load(){
  try{const C=window.api?await api.config():{name:'פתח תקווה',lat:32.084,lon:34.8878};
   const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${C.lat}&longitude=${C.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
   const j=await r.json();show(j.current.temperature_2m,j.current.weather_code,j.daily.temperature_2m_max[0],j.daily.temperature_2m_min[0],C.name);}
  catch(e){document.getElementById('c').textContent='Offline';document.getElementById('city').textContent='פתח תקווה'}
}
if(q.get('demo'))show(27,1,29,21,'פתח תקווה');else{load();setInterval(load,15*60e3)}
</script>
